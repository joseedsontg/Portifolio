<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre em contato com José Edson">
    <title>Contato | José Edson</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- HEADER -->
    <header id="header">
        <div class="container header-container">
            <div class="terminal-dots">
                <span class="dot-red"></span>
                <span class="dot-yellow"></span>
                <span class="dot-green"></span>
            </div>
            <a href="index.html" class="logo-area">
                <h1 class="header-nome">jose-edson</h1>
            </a>
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
                <i class="fas fa-terminal"></i>
            </button>
            <nav id="navMenu" class="nav-menu">
                <ul>
                    <li><a href="sobre.html">sobre</a></li>
                    <li><a href="habilidades.html">skills</a></li>
                    <li><a href="projetos.html">projetos</a></li>
                    <li><a href="contato.html" class="nav-ativo">contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- CONTATO -->
    <section class="section page-section">
        <div class="container">
            <h2 class="section-titulo typing-titulo" data-text="contato"></h2>
            <p class="section-intro fade-in">
                Quer trocar uma ideia, propor uma parceria ou só bater um papo sobre tecnologia? Fique à vontade para me enviar uma mensagem pelo formulário abaixo!
            </p>
            <form id="formContato" class="form-contato fade-in" action="https://formspree.io/f/maqlaryl" method="POST" novalidate>
                <div class="form-grupo">
                    <label for="nome">nome</label>
                    <input type="text" id="nome" name="nome" placeholder="seu_nome" required>
                    <span class="erro-msg" id="erroNome"></span>
                </div>
                <div class="form-grupo">
                    <label for="email">email</label>
                    <input type="email" id="email" name="email" placeholder="user@mail.com" required>
                    <span class="erro-msg" id="erroEmail"></span>
                </div>
                <div class="form-grupo">
                    <label for="mensagem">mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="// escreva sua mensagem aqui..." required></textarea>
                    <span class="erro-msg" id="erroMensagem"></span>
                </div>
                <button type="submit" class="btn btn-enviar">$ enviar_mensagem</button>
                <div id="formSucesso" class="form-sucesso oculto">
                    <i class="fas fa-check-circle"></i>
                    <p>✓ Mensagem enviada com sucesso!</p>
                </div>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer id="footer">
        <div class="container footer-container">
            <div class="footer-redes">
                <a href="https://www.linkedin.com/in/joseedsonteixeiragaldino" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="https://github.com/joseedsontg" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://instagram.com/joseedson.tg" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="mailto:joseedsontg@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
            </div>
            <p>&copy; <span id="anoAtual"></span> José Edson Teixeira Galdino</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
